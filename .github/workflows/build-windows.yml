name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Build release bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Architecture x64

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: oksana-vpn-windows-x64
          path: build/release/oksana-vpn-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
